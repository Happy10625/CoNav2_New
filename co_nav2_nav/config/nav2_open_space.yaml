# Deliberately limited profile for supervised tests in a controlled area.
# Livox obstacle layers are enabled for the target-approach phase. They do not
# detect drop-offs, so stairs and ledges must still be physically excluded.
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      footprint: "[[0.36, 0.25], [0.36, -0.25], [-0.36, -0.25], [-0.36, 0.25]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: fastlio_cloud
        fastlio_cloud:
          topic: /cloud_registered_body
          sensor_frame: livox_frame
          data_type: PointCloud2
          marking: true
          clearing: true
          raytrace_min_range: 0.20
          raytrace_max_range: 8.0
          obstacle_min_range: 0.20
          obstacle_max_range: 7.5
          min_obstacle_height: 0.05
          max_obstacle_height: 1.50

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.36, 0.25], [0.36, -0.25], [-0.36, -0.25], [-0.36, 0.25]]"
      footprint_padding: 0.03
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        observation_sources: fastlio_cloud
        fastlio_cloud:
          topic: /cloud_registered_body
          sensor_frame: livox_frame
          data_type: PointCloud2
          marking: true
          clearing: true
          raytrace_min_range: 0.20
          raytrace_max_range: 8.0
          obstacle_min_range: 0.20
          obstacle_max_range: 7.5
          min_obstacle_height: 0.05
          max_obstacle_height: 1.50

controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.05
      movement_time_allowance: 15.0
    general_goal_checker:
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.10
      stateful: true
    FollowPath:
      min_vel_x: 0.0
      max_vel_x: 0.10
      max_speed_xy: 0.10
      max_vel_theta: 0.25
      acc_lim_x: 0.20
      acc_lim_theta: 0.40
      decel_lim_x: -0.20
      decel_lim_theta: -0.40
      trans_stopped_velocity: 0.03

velocity_smoother:
  ros__parameters:
    max_velocity: [0.10, 0.0, 0.25]
    min_velocity: [-0.10, 0.0, -0.25]
    max_accel: [0.20, 0.0, 0.40]
    max_decel: [-0.20, 0.0, -0.40]

behavior_server:
  ros__parameters:
    # Spin is invoked explicitly for camera scans and target observation. It is
    # not added to the no-recovery behavior tree, so Nav2 cannot start an
    # unsolicited recovery rotation.
    behavior_plugins: ["spin", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    max_rotational_vel: 0.25
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.40
    simulate_ahead_time: 2.0

bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: package://co_nav2_nav/behavior_trees/open_space_no_recovery.xml
    default_nav_through_poses_bt_xml: package://co_nav2_nav/behavior_trees/open_space_through_poses_no_recovery.xml
