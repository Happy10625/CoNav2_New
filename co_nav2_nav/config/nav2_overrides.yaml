# Safe Nav2 overrides used by the co-nav2 reproduction stack.
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      footprint: "[[0.36, 0.25], [0.36, -0.25], [-0.36, -0.25], [-0.36, 0.25]]"
      footprint_padding: 0.03
      obstacle_layer:
        observation_sources: fastlio_cloud
        fastlio_cloud:
          # Use the current scan in the moving FAST_LIO body frame.  The
          # world-frame cloud has sensor origin camera_init=(0,0,0), which
          # leaves a rolling local costmap as the robot moves and breaks
          # obstacle clearing/raytracing.
          topic: /cloud_registered_body
          sensor_frame: livox_frame
          data_type: PointCloud2
          marking: true
          clearing: true
          raytrace_min_range: 0.20
          raytrace_max_range: 8.0
          obstacle_min_range: 0.20
          obstacle_max_range: 7.5
          min_obstacle_height: 0.05
          max_obstacle_height: 1.50

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.36, 0.25], [0.36, -0.25], [-0.36, -0.25], [-0.36, 0.25]]"
      footprint_padding: 0.03
      voxel_layer:
        observation_sources: fastlio_cloud
        fastlio_cloud:
          topic: /cloud_registered_body
          sensor_frame: livox_frame
          data_type: PointCloud2
          marking: true
          clearing: true
          raytrace_min_range: 0.20
          raytrace_max_range: 8.0
          obstacle_min_range: 0.20
          obstacle_max_range: 7.5
          min_obstacle_height: 0.05
          max_obstacle_height: 1.50

controller_server:
  ros__parameters:
    general_goal_checker:
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10
      stateful: true
    FollowPath:
      max_vel_x: 0.20
      max_vel_theta: 0.40
