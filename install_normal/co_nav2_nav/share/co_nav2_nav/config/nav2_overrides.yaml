# Merge these values into the complete Nav2 parameter file used by ck-nav2.
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      footprint: "[[0.36, 0.25], [0.36, -0.25], [-0.36, -0.25], [-0.36, 0.25]]"
      footprint_padding: 0.03
      obstacle_layer:
        observation_sources: fastlio_cloud
        fastlio_cloud:
          topic: /cloud_registered
          data_type: PointCloud2
          marking: true
          clearing: true
          raytrace_min_range: 0.20
          raytrace_max_range: 8.0
          obstacle_min_range: 0.20
          obstacle_max_range: 7.5
          min_obstacle_height: 0.05
          max_obstacle_height: 1.50

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.36, 0.25], [0.36, -0.25], [-0.36, -0.25], [-0.36, 0.25]]"
      footprint_padding: 0.03
      voxel_layer:
        observation_sources: fastlio_cloud
        fastlio_cloud:
          topic: /cloud_registered
          data_type: PointCloud2
          marking: true
          clearing: true
          raytrace_min_range: 0.20
          raytrace_max_range: 8.0
          obstacle_min_range: 0.20
          obstacle_max_range: 7.5
          min_obstacle_height: 0.05
          max_obstacle_height: 1.50

controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 0.20
      max_vel_theta: 0.40
