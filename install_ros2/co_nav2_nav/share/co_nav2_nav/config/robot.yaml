fastlio_odom_adapter:
  ros__parameters:
    input_odom_topic: /Odometry
    output_odom_topic: /fastlio/odom
    odom_frame: odom
    base_frame: base_link
    publish_tf: true
    base_to_body_xyz: [0.299, -0.02329, 0.32088]
    base_to_body_rpy: [0.0, 0.0, 3.141592653589793]

semantic_explorer:
  ros__parameters:
    enabled: false  # Safety gate: enable only after manual Nav2 validation.
    map_topic: /map
    global_frame: map
    base_frame: base_link
    navigate_action: /navigate_to_pose
    target_object: chair
    detection_confidence: 0.65
    confirm_frames: 3
    confirmation_radius: 0.35
    standoff_distance: 0.8
    exploration_timeout: 120.0
    goal_reached_distance: 0.35
    min_frontier_cells: 8
    frontier_replan_period: 3.0
    enable_perception: false  # Set true only after the RGB-D camera TF is calibrated.
    rgb_topic: /camera/color/image_raw
    depth_topic: /camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/color/camera_info
    camera_frame: camera_color_optical_frame
    min_valid_depth_pixels: 30
    max_detection_depth: 4.0
    model_device: cuda:0
    yolo_model_path: /home/isee-cdh/ws/Co-NavGPT2/yolov8l-world.pt
    sam_model_path: /home/isee-cdh/ws/Co-NavGPT2/mobile_sam.pt
    # Supervised empty-area mode. The dedicated launch file overrides this to
    # true while keeping `enabled` false until the operator explicitly arms it.
    open_space_mode: false
    scan_first: true
    scan_steps: 8
    allow_frontier_after_scan: true
    max_travel_radius: 3.0
    test_timeout: 180.0
    tf_failure_timeout: 1.0
    # GPU inference may take several seconds; this must exceed one full
    # YOLO+SAM inference interval to avoid false target-loss cancellation.
    target_lost_timeout: 10.0
    target_observation_attempts: 2
    publish_stop_command: true
    stop_cmd_topic: /cmd_vel
